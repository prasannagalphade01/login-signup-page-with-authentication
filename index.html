<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Auth Project</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-layout">
      <div class="card" id="loginCard">
        <h1 class="title">Welcome back</h1>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <label for="loginEmail">Email</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="Enter your email"
          required
        />

        <label for="loginPassword">Password</label>
        <div class="password-wrapper">
          <input
            id="loginPassword"
            type="password"
            placeholder="Password"
            required
          />
          <button
            type="button"
            class="show-pass"
            onclick="togglePass('loginPassword', this)"
          >
            Show
          </button>
        </div>

        <div class="row between">
          <a class="link" id="forgotLink">Forgot password</a>
        </div>

        <button class="btn primary" id="loginBtn">Login</button>
        <div class="authRedirect">
          <p class="muted">
            Don’t have an account?
            <a class="link" id="showSignup">Sign up for free</a>
          </p>
        </div>
      </div>

      <div class="card hidden" id="signupCard">
        <h1 class="title">Create account</h1>
        <p class="subtitle">Start your free account.</p>

        <label for="signupEmail">Email</label>
        <input
          id="signupEmail"
          type="email"
          placeholder="Enter your email"
          required
        />

        <label for="signupPassword">Password</label>
        <div class="password-wrapper">
          <input
            id="signupPassword"
            type="password"
            placeholder="Password"
            required
          />
          <button
            type="button"
            class="show-pass"
            onclick="togglePass('signupPassword', this)"
          >
            Show
          </button>
        </div>

        <label for="signupRePassword">Confirm password</label>
        <div class="password-wrapper">
          <input
            id="signupRePassword"
            type="password"
            placeholder="Repeat password"
            required
          />
          <button
            type="button"
            class="show-pass"
            onclick="togglePass('signupRePassword', this)"
          >
            Show
          </button>
        </div>

        <p class="error" id="signupError"></p>

        <button class="btn primary" id="signupBtn">Sign up</button>
        <div class="authRedirect">
          <p class="muted">
            Already have an account? <a class="link" id="showLogin">Login</a>
          </p>
        </div>
      </div>
    </main>

    <!-- Forgot modal -->
    <div class="modal" id="forgotModal" aria-hidden="true">
      <div class="modal-content">
        <h3>Reset password</h3>
        <p class="muted">Enter your email and we'll send reset instructions.</p>
        <input id="forgotEmail" type="email" placeholder="Enter your email" />
        <div class="row">
          <button class="btn ghost" id="cancelForgot">Cancel</button>
          <button class="btn primary" id="submitForgot">Submit</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
